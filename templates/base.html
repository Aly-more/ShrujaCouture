<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}

            Shruja Couture

        {% endblock %}

    </title>

    {% load static %}

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Global CSS -->

    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/new-arrivals.css' %}">
    <link rel="stylesheet" href="{% static 'css/category.css' %}">
    <link rel="stylesheet" href="{% static 'css/product-detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/quick-add.css' %}">
    <link rel="stylesheet" href="{% static 'css/journal.css' %}">
    <link rel="stylesheet" href="{% static 'css/wishlist.css' %}">
    <link rel="stylesheet" href="{% static 'css/cart.css' %}">
    <link rel="stylesheet" href="{% static 'css/order-success.css' %}">
    <link rel="stylesheet" href="{% static 'css/my-orders.css' %}">
    <link rel="stylesheet" href="{% static 'css/order-detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/search.css' %}">
    <link rel="stylesheet" href="{% static 'css/shop.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">
    <link rel="stylesheet" href="{% static 'css/modal.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/privacy-policy.css' %}">
    


    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->

    {% include "includes/navbar.html" %}

    <!-- ==========================
            PAGE CONTENT
    =========================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>

    <!-- ==========================
            FOOTER
    =========================== -->

    {% include "includes/footer.html" %}

    <!-- ==========================
            GLOBAL TOAST
    =========================== -->

    {% include "includes/toast.html" %}

    <!-- ==========================
            PAGE SCRIPTS
    =========================== -->

    {% block scripts %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}

    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>

        if (window.lucide) {

            lucide.createIcons();

        }

    </script>

    <!-- Global JS -->
    <script src="{% static 'js/navbar.js' %}"></script>

    <script src="{% static 'js/animations.js' %}"></script>

    <script src="{% static 'js/wishlist.js' %}"></script>

    <script src="{% static 'js/toast.js' %}"></script>

    <script src="{% static 'js/contact.js' %}"></script>
   
    <script src="{% static 'js/footer.js' %}"></script>

</body>

</html>
